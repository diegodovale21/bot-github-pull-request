# Configuração do bot de geração automática de descrição de PRs
# Você pode adaptar as chaves e templates conforme sua necessidade.

templates:
  default_title: 'Descrição automática: {branch}'
  sections:
    - id: problem
      title: 'Qual o problema / Contexto'
      required: true
      placeholder: 'Descreva o problema que este PR resolve...'
    - id: solution
      title: 'Solução proposta'
      required: true
      placeholder: 'Descreva a solução, principais mudanças e decisões...'
    - id: tests
      title: 'Como testar'
      required: false
      placeholder: 'Passos para reproduzir / validar'
  footer: |
    _Gerado automaticamente — se precisar alterar, edite .github/.bot.yml_

rules:
  # Incluir lista de arquivos modificados no resumo
  include_changelist: true

  # Número máximo de linhas para exibir de cada arquivo no changelist
  max_excerpt_lines: 50

  # Comprimento máximo de cada seção (caracteres)
  max_section_length: 2000

  # Usar LLM para gerar descrição automática baseada nas mudanças
  use_llm: true

  # Configuração do LLM (atualmente suporta OpenAI)
  llm:
    provider: 'openai' # 'openai' ou 'none' para desabilitar
    model: 'gpt-4o-mini' # Modelo a usar (gpt-4o-mini, gpt-4o, gpt-3.5-turbo)
    temperature: 0.7 # Criatividade (0.0 = determinístico, 1.0 = criativo)
    max_tokens: 1000 # Tamanho máximo da resposta
    # API key deve ser configurada como secret: OPENAI_API_KEY

  # Extensões de arquivo a ignorar (não incluídos no changelist)
  ignore_extensions:
    - '.png'
    - '.jpg'
    - '.jpeg'
    - '.gif'
    - '.svg'
    - '.ico'
    - '.woff'
    - '.woff2'
    - '.ttf'
    - '.eot'
    - '.pdf'
    - '.zip'
    - '.tar'
    - '.gz'
    - '.bin'

  # Patterns de arquivos a ignorar (glob patterns)
  ignore_patterns:
    - '**/*.min.js'
    - '**/*.min.css'
    - '**/package-lock.json'
    - '**/yarn.lock'
    - '**/node_modules/**'

  # Usar delimitadores para preservar conteúdo do usuário
  # Se true, o bot só atualiza conteúdo entre <!-- BOT_START --> e <!-- BOT_END -->
  use_delimiters: true

  # Nome do bot (usado para evitar loops - verificar se o sender é o bot)
  bot_name: 'github-actions[bot]'
